<rect x="45" y="451" width="15" height="15" rx="3" fill="#66d6b0"/><text x="70" y="463" fill="#e5f3ff" font-family="system-ui,sans-serif" font-size="12">Diseño implementado</text><rect x="45" y="477" width="15" height="15" rx="3" fill="#ffcf8b"/><text x="70" y="489" fill="#e5f3ff" font-family="system-ui,sans-serif" font-size="12">OAuth y acceso real pendientes</text><text x="770" y="480" fill="#8da8c8" font-family="system-ui,sans-serif" font-size="10">Diagrama del diseño, no prueba de sesión activa.</text>
</svg>