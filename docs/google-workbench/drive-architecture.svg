<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Drive Workbench architecture</title>
<desc id="desc">An Anatomy-inspired technical cutaway showing the local browser, Node server, in-memory OAuth session, Google OAuth, and read-only Drive API. The design is implemented in code but real account authorization remains unverified.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#1d3553"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf1fa"/><stop offset="1" stop-color="#9aacc4"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66d6b0"/></marker><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1100" height="520" rx="24" fill="url(#bg)"/><text x="42" y="45" fill="#b8d6ff" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="3">BLADI 3AI · ANATOMY / SYSTEM MAP</text><text x="42" y="79" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="750">Drive Workbench</text><text x="42" y="104" fill="#c5d4e7" font-family="system-ui,sans-serif" font-size="14">Lectura y búsqueda autorizadas · sin operaciones de escritura</text>
<g filter="url(#shadow)"><path d="M45 160 H250 L280 185 V340 H45 Z" fill="url(#metal)" stroke="#fff" stroke-opacity=".6"/><path d="M45 160 H250 L280 185 H75 Z" fill="#fff" fill-opacity=".55"/><rect x="66" y="205" width="192" height="112" rx="9" fill="#13233b"/><path d="M84 227 H235 M84 251 H235 M84 275 H235 M84 299 H235" stroke="#35577e" stroke-width="12" stroke-linecap="round"/><path d="M95 227 H164 M95 251 H204 M95 275 H175 M95 299 H220" stroke="#bdd2ee" stroke-width="4" stroke-linecap="round"/><text x="162" y="367" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Interfaz local</text><text x="162" y="388" fill="#b9cce4" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Búsqueda · metadatos · vista previa</text></g>
<g filter="url(#shadow)"><path d="M385 150 H620 L650 180 V365 H385 Z" fill="#193550" stroke="#6f92ba" stroke-width="2"/><path d="M385 150 H620 L650 180 H415 Z" fill="#3c6088"/><rect x="405" y="200" width="210" height="47" rx="8" fill="#102039" stroke="#5279a5"/><text x="510" y="220" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Servidor Node.js</text><text x="510" y="237" fill="#c4d8ef" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">OAuth callback · Drive API</text><rect x="405" y="270" width="210" height="59" rx="8" fill="#122d3e" stroke="#66d6b0"/><text x="510" y="292" fill="#9df2d4" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Tokens en memoria</text><text x="510" y="311" fill="#d1e8e4" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Scope drive.readonly</text><text x="515" y="394" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Límite de confianza local</text><text x="515" y="414" fill="#b9cce4" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Sin escrituras ni borrados</text></g>
