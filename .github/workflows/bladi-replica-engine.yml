name: BLADI REPLICA ENGINE tests

on:
  push:
    paths:
      - "bladi_replica_engine/**"
      - "tests/test_bladi_replica_engine.py"
      - ".github/workflows/bladi-replica-engine.yml"
  pull_request:
    paths:
      - "bladi_replica_engine/**"
      - "tests/test_bladi_replica_engine.py"
      - ".github/workflows/bladi-replica-engine.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run engine tests
        run: python -m unittest discover -s tests -p "test_bladi_replica*.py" -v
