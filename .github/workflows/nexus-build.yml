name: Build Nexus AI Hub

on:
  pull_request:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-build.yml"
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Parse serverless backends
        run: |
          npx esbuild netlify/functions/api.ts --bundle --platform=node --external:@netlify/functions --outfile=/tmp/nexus-netlify-api.js
          npx esbuild api/index.ts --bundle --platform=node --outfile=/tmp/nexus-vercel-api.js
      - name: Validate multi-AI team contract
        run: node scripts/validate-team-routing.mjs
