name: AEGIS Live Model Harness Checks

on:
  push:
    branches:
      - aegis-live-model-v0.1
    paths:
      - "aegis-competition/live-model/**"
      - ".github/workflows/aegis-live-model.yml"
  pull_request:
    branches:
      - aegis-competition-v0.4
    paths:
      - "aegis-competition/live-model/**"
      - ".github/workflows/aegis-live-model.yml"

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check aegis-competition/live-model/live-model-eval.mjs
      - name: Validate case JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('aegis-competition/live-model/cases.json','utf8')); console.log('cases.json valid')"
      - name: Verify harness requires explicit credentials
        run: |
          if AEGIS_MODEL_API_KEY= AEGIS_MODEL_NAME= node aegis-competition/live-model/live-model-eval.mjs; then
            echo "Harness unexpectedly ran without credentials"
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
