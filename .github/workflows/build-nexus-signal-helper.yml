name: Build Nexus Signal Helper APK

on:
  push:
    branches: [feat/nexus-signal-booster]
    paths:
      - "projects/nexus-signal-helper/**"
      - ".github/workflows/build-nexus-signal-helper.yml"
  pull_request:
    paths:
      - "projects/nexus-signal-helper/**"
      - ".github/workflows/build-nexus-signal-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: projects/nexus-signal-helper
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-signal-helper-debug-apk
          path: projects/nexus-signal-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
