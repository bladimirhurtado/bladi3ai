name: Sync and verify Anatomy skill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-anatomy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anatomy-vendor-sync-fast-validation
  cancel-in-progress: true

jobs:
  vendor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without a persisted write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome for browser-based regression tests
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Download pinned official Anatomy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/anatomy-source
          curl --fail --location --retry 3 \
            https://github.com/wheresryan22/anatomy/archive/e6600ffc4e8e6620eeb45bf49bcdbd5e4b84163f.tar.gz \
            -o /tmp/anatomy.tar.gz
          tar -xzf /tmp/anatomy.tar.gz --strip-components=1 -C /tmp/anatomy-source
          test -s /tmp/anatomy-source/SKILL.md
          test -s /tmp/anatomy-source/LICENSE
          test -d /tmp/anatomy-source/kit
          test -d /tmp/anatomy-source/references
          test -d /tmp/anatomy-source/examples
          test -d /tmp/anatomy-source/scripts

      - name: Install complete skill in the standard Codex path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agents/skills/anatomy skills/anatomy
          mkdir -p .agents/skills/anatomy skills
          cp -a /tmp/anatomy-source/. .agents/skills/anatomy/
          cat > .agents/skills/anatomy/VENDOR.md <<'EOF'
          # Anatomy vendor copy

          This folder contains the pinned upstream Anatomy agent skill from https://github.com/wheresryan22/anatomy.
          Upstream commit: e6600ffc4e8e6620eeb45bf49bcdbd5e4b84163f.
          The source, examples, scripts, references, kit and MIT license are preserved.
          Codex discovers project skills from `.agents/skills/anatomy/SKILL.md`.
          The `skills/anatomy` path is a compatibility symlink to this canonical copy.
          EOF
          ln -s ../.agents/skills/anatomy skills/anatomy

      - name: Verify full source inventory
        shell: bash
        run: |
          set -euo pipefail
          cd .agents/skills/anatomy
          for file in \
            SKILL.md LICENSE references/craft.md references/kit.md \
            references/motion.md references/react.md references/verify.md \
            references/webgl.md references/3d.md kit/iso-kit.mjs \
            scripts/capture.mjs scripts/drive.mjs examples/dial-indicator/build.mjs; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          test "$(find examples -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" -ge 8
          echo "Examples: $(find examples -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Kit files: $(find kit -type f | wc -l)"
          echo "Reference files: $(find references -type f | wc -l)"
          echo "Script files: $(find scripts -type f | wc -l)"

      - name: Run upstream regression tests
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test_deps="$(mktemp -d)"
          trap 'rm -rf "$test_deps"' EXIT
          npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts \
            react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2
          cd .agents/skills/anatomy
          NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs

      - name: Rebuild representative upstream examples and verify vendored source
        shell: bash
        run: |
          set -euo pipefail
          cd .agents/skills/anatomy
          # Exercise the fast, framework-free SVG examples in both themes.
          node examples/dial-indicator/build.mjs
          node examples/dial-indicator/build.mjs --light
          node examples/desk-computer/build.mjs
          node examples/desk-computer/build.mjs --light
          # Ensure rebuilding representative pages did not alter the pinned upstream tree.
          diff -qr /tmp/anatomy-source/examples examples

      - name: Commit verified skill with short-lived workflow token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .agents/skills/anatomy skills/anatomy
          if git diff --cached --quiet; then
            echo "Anatomy vendor is already up to date."
            exit 0
          fi
          git commit -m "Vendor complete Anatomy skill and examples"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
