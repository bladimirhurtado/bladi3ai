name: ARK zone relationship tests
on:
  push:
    branches:
      - "ark/**"
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ARK zone relation tests
        run: python -m unittest discover -s tests -p 'test_ark_zone_relation_builder.py' -v
