name: REA tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show Python version
        run: python --version
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate skills metadata
        run: python scripts/validate-skills.py
