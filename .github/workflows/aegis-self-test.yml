name: AEGIS synthetic and scope-gate tests

on:
  push:
    branches:
      - aegis-competition-v0.3
      - aegis-competition-v0.4
  pull_request:
    branches:
      - aegis-competition-v0.3
      - aegis-competition-v0.4

jobs:
  synthetic-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate JavaScript modules and scope templates
        run: |
          node --check aegis-competition/engine.mjs
          node --check aegis-competition/audit-record.mjs
          node --check aegis-competition/self-test.mjs
          node --check aegis-competition/scoped-runner.mjs
          node --check aegis-competition/scoped-cli.mjs
          node --check aegis-competition/scoped-runner.test.mjs
          node --input-type=module --check < aegis-competition/app.js
          node -e "const fs=require('node:fs'); for (const p of ['aegis-competition/lab-spec.json','aegis-competition/engagement-scope.template.json']) JSON.parse(fs.readFileSync(p,'utf8'))"
      - name: Run shared-engine synthetic and adversarial tests
        run: node aegis-competition/self-test.mjs
      - name: Run fail-closed scope-gate tests with mocked transport
        run: node aegis-competition/scoped-runner.test.mjs
      - name: Confirm CLI refuses to run without a scope file
        shell: bash
        run: |
          set +e
          output=$(env -u AEGIS_SCOPE_FILE node aegis-competition/scoped-cli.mjs --check health-status 2>&1)
          result=$?
          set -e
          test "$result" -ne 0
          echo "$output" | grep -q "AEGIS_SCOPE_FILE must be an absolute file path"
          echo "CLI fail-closed preflight: PASS"
