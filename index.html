<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d4aff"><meta name="description" content="Bladi 3AI — plataforma educativa offline-first para aprender programación, web, apps e IA."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Bladi 3AI · Plataforma Educativa</title><style>body{font-family:system-ui;margin:0;background:#f7f6fb;color:#171321}main{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#6d4aff,#9b5cff);color:white;padding:28px;border-radius:24px}.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}.card{background:white;border:1px solid #e8e2f4;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0000000d}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#6d4aff;color:white}.muted{color:#6d6678}.bar{height:10px;background:#e8e3ef;border-radius:99px;overflow:hidden}.fill{height:100%;background:#6d4aff}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stat{background:#ffffff22;padding:10px 14px;border-radius:12px}dialog{border:0;border-radius:20px;max-width:650px;width:90%;padding:0}dialog::backdrop{background:#0008}.modal{padding:24px}.lesson{padding:14px;border:1px solid #eee;border-radius:14px;margin:10px 0}button:focus{outline:3px solid #c7baff}@media(max-width:600px){main{padding:14px}.hero{padding:20px}}
</style></head><body><main><section class="hero"><h1>🧠 Bladi 3AI</h1><p>Aprende programación, web, Android e inteligencia artificial a tu ritmo.</p><div class="stats"><span class="stat">📚 4 cursos</span><span class="stat">🎯 Objetivo diario</span><span class="stat">🔥 Racha</span><span class="stat">🏆 Insignias</span></div></section><section class="card" style="margin-top:20px"><h2>Mi progreso</h2><div class="bar"><div id="overall" class="fill" style="width:0%"></div></div><p id="progressText" class="muted">0% completado · 0 lecciones</p><button class="btn primary" onclick="continueLearning()">Continuar aprendiendo</button> <button class="btn" onclick="resetProgress()">Reiniciar</button></section><section><h2>📚 Cursos</h2><div id="courses" class="courses"></div></section></main><dialog id="dlg"><div class="modal"><button class="btn" style="float:right" onclick="dlg.close()">✕</button><div id="modalContent"></div></div></dialog><script>
const courses=[
{id:'python',title:'Programación Básica con Python',level:'Inicial',lessons:['Variables y tipos','Operadores','Condicionales','Bucles','Funciones','Listas','Diccionarios','Errores','Módulos','Proyecto final']},
{id:'web',title:'Desarrollo Web HTML, CSS y JavaScript',level:'Inicial',lessons:['HTML básico','Enlaces e imágenes','Formularios','CSS básico','Modelo de caja','Flexbox','JavaScript básico','DOM','Eventos','Proyecto web']},
{id:'android',title:'Desarrollo de Apps Android con Kotlin',level:'Intermedio',lessons:['Kotlin básico','Variables y funciones','Clases','Colecciones','Android Studio','Jetpack Compose','Estado','Navegación','Listas','Proyecto Android']},
{id:'ia',title:'IA y Machine Learning Práctico',level:'Intermedio',lessons:['Qué es IA','Datos','Python para datos','NumPy','Pandas','Visualización','Aprendizaje supervisado','Clasificación','Evaluación','Proyecto ML']}
];
let state=JSON.parse(localStorage.getItem('bladi3ai_2026')||'{}');state.progress=state.progress||{};state.done=state.done||{};state.points=state.points||0;state.streak=state.streak||0;
function save(){localStorage.setItem('bladi3ai_2026',JSON.stringify(state));render()}
function pct(c){return Math.round(((state.done[c.id]||[]).length/c.lessons.length)*100)}
function render(){const box=document.getElementById('courses');box.innerHTML=courses.map(c=>`<article class="card"><h3>${c.title}</h3><p class="muted">${c.level} · ${c.lessons.length} lecciones</p><div class="bar"><div class="fill" style="width:${pct(c)}%"></div></div><p>${pct(c)}% · ${ (state.done[c.id]||[]).length}/${c.lessons.length}</p><button class="btn primary" onclick="openCourse('${c.id}')">Abrir curso</button></article>`).join('');const total=courses.reduce((a,c)=>a+c.lessons.length,0),done=courses.reduce((a,c)=>a+(state.done[c.id]||[]).length,0),p=Math.round(done/total*100);document.getElementById('overall').style.width=p+'%';document.getElementById('progressText').textContent=`${p}% completado · ${done}/${total} lecciones · ${state.points} puntos · 🔥 ${state.streak}`}
function openCourse(id){const c=courses.find(x=>x.id===id);const done=state.done[id]||[];document.getElementById('modalContent').innerHTML=`<h2>${c.title}</h2><p class="muted">${c.level} · ${done.length}/${c.lessons.length} completadas</p>${c.lessons.map((l,i)=>`<div class="lesson"><b>${i+1}. ${l}</b><p>Aprende los conceptos fundamentales de <b>${l}</b> con práctica guiada y un pequeño reto.</p><button class="btn ${done.includes(i)?'':'primary'}" onclick="completeLesson('${id}',${i})">${done.includes(i)?'✓ Completada':'Completar lección'}</button></div>`).join('')}`;dlg.showModal()}
function completeLesson(id,i){state.done[id]=state.done[id]||[];if(!state.done[id].includes(i)){state.done[id].push(i);state.points+=10;state.streak=Math.max(1,state.streak);save()}openCourse(id)}
function continueLearning(){const c=courses.find(x=>(state.done[x.id]||[]).length<x.lessons.length)||courses[0];openCourse(c.id)}
function resetProgress(){if(confirm('¿Reiniciar todo el progreso?')){state={progress:{},done:{},points:0,streak:0};save()}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
