<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AEGIS Competition Lab — synthetic adversarial reasoning">
<title>AEGIS Competition Lab v0.1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
<header>
  <div><span class="eyebrow">CONTROLLED LAB</span><h1>AEGIS <span>♟</span> Competition Lab</h1></div>
  <div class="badge" id="mode">OFFLINE / SYNTHETIC</div>
</header>
<section class="hero">
  <div class="orb"></div>
  <div><div class="label">MATCH STATUS</div><div id="status">Ready — no external systems involved.</div></div>
  <button id="run">Run full match</button>
</section>
<section class="grid">
  <article><h2>Board</h2><pre id="board"></pre></article>
  <article><h2>Reasoning tree</h2><div id="tree" class="tree"></div></article>
  <article><h2>Judge</h2><div id="score" class="score">—</div><div id="verdict">Waiting for evidence.</div></article>
</section>
<section class="grid lower">
  <article><h2>Event log</h2><div id="log" class="log"></div></article>
  <article><h2>Integrity</h2><ul id="integrity"></ul></article>
</section>
<footer>AEGIS v0.1 • HYDRA • JUDGE • Synthetic lab only</footer>
</main>
<script src="app.js"></script>
</body>
</html>
